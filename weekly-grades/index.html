<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#e3f5ec">
<meta name="description" content="تقييمي الأسبوعي: مهام يومية ونقاط ومستويات ومكافآت للعائلة">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="تقييمي">
<title>تقييمي الأسبوعي</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%8F%86%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800&amp;display=swap">
<style>
/* ===================== Theme tokens (overridden from JS) ===================== */
:root{
  --bg1:#e3f5ec;--bg2:#e2eefa;--bg3:#fcf5e6;
  --card:rgba(255,255,255,.82);--card-solid:#fff;
  --text:#16302a;--muted:#5b6f6a;--accent:#0f8a6d;--on-accent:#fff;
  --line:rgba(15,60,50,.13);--soft:rgba(15,138,109,.12);
  --pat-img:none;--flow1:transparent;--flow2:transparent;--flow3:transparent;
  --shape-c:rgba(15,138,109,.14);--bub-c:rgba(110,190,220,.35);
  --warn:#9a5b00;--warn-bg:rgba(245,166,35,.2);--ok:#0f7a4a;--ok-bg:rgba(26,158,95,.16);--bad:#c0352b;
  --r:24px;--shadow:0 10px 28px rgba(20,50,40,.08),0 1px 2px rgba(20,50,40,.06);
  --spd:1;--fs:1;--font:"Tajawal";
  color-scheme:light;
}
[data-theme="dark"]{color-scheme:dark;--bub-o:.3;--warn:#f4b450;--warn-bg:rgba(245,166,35,.2);--ok:#4fd69c;--ok-bg:rgba(60,207,142,.17);--bad:#ff8378;--shadow:0 10px 28px rgba(0,0,0,.35)}
[data-g="S"]{--gc:#f5c534;--gc2:#c98f00;--gt:#3b2900;--chip-bg:#f2c230;--chip-t:#3b2900}
[data-g="A"]{--gc:#25a866;--gc2:#137a46;--gt:#fff;--chip-bg:#137a46;--chip-t:#fff}
[data-g="B"]{--gc:#3d86e0;--gc2:#2160b0;--gt:#fff;--chip-bg:#2160b0;--chip-t:#fff}
[data-g="C"]{--gc:#f5a04a;--gc2:#d4700f;--gt:#3a1c00;--chip-bg:#f39a3d;--chip-t:#3a1c00}
[data-g="D"]{--gc:#e6594e;--gc2:#b8302a;--gt:#fff;--chip-bg:#b8302a;--chip-t:#fff}

/* ===================== Base ===================== */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:calc(100% * var(--fs));-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg1);color:var(--text);font-family:var(--font),"Tajawal",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-weight:500;line-height:1.55;-webkit-tap-highlight-color:transparent}
body.modal-open,body.game-open{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
button:disabled{cursor:not-allowed}
h1,h2,h3,p{margin:0}
b,strong{font-weight:800}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr-only{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.muted{color:var(--muted)}.sm{font-size:.85rem}.center{text-align:center}.grow{flex:1;min-width:0}
.note{margin-top:10px;font-size:.8rem;color:var(--muted)}
.msg{margin-top:8px;font-weight:800;font-size:.9rem}.msg:empty{display:none}.err,.msg.err{color:var(--bad)}
.msg .btn{margin-top:8px}
.warn-msg{color:var(--warn);font-weight:800;font-size:.88rem;margin-top:8px}
.danger-t{color:var(--bad)}

/* ===================== Animated background ===================== */
#bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3))}
#bgfx::before{content:"";position:absolute;inset:-40px;background-image:var(--pat-img);background-size:40px 40px}
#bgfx.m-drift::before{animation:drift calc(16s * var(--spd)) linear infinite;will-change:transform}
@keyframes drift{to{transform:translate3d(40px,40px,0)}}
.bg-flow{position:absolute;left:50%;top:50%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;background:radial-gradient(circle at 28% 30%,var(--flow1),transparent 42%),radial-gradient(circle at 72% 42%,var(--flow2),transparent 40%),radial-gradient(circle at 46% 76%,var(--flow3),transparent 42%);opacity:0;transition:opacity .8s}
#bgfx.m-flow .bg-flow{opacity:.8;animation:spin calc(70s * var(--spd)) linear infinite;will-change:transform}
@keyframes spin{to{transform:rotate(360deg)}}
.bg-shapes,.bg-bubbles{position:absolute;inset:0;display:none}
#bgfx.m-shapes .bg-shapes,#bgfx.m-bubbles .bg-bubbles{display:block}
.shape,.bub{position:absolute;top:0;left:var(--x);--rot:0deg;animation:rise calc(var(--d) * var(--spd)) linear infinite;animation-delay:calc(var(--dl) * var(--spd));will-change:transform}
.shape{width:var(--s);height:var(--s);border-radius:var(--br);background:var(--shape-c)}
.bub i{display:block;width:var(--s);height:var(--s);border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95),rgba(255,255,255,.35) 22%,var(--bub-c) 62%,rgba(255,255,255,.18));border:1px solid rgba(255,255,255,.55);opacity:var(--bub-o,.55);animation:sway calc(var(--sw) * var(--spd)) ease-in-out infinite alternate}
@keyframes rise{from{transform:translate3d(0,110vh,0) rotate(0deg)}to{transform:translate3d(0,-25vh,0) rotate(var(--rot))}}
@keyframes sway{from{transform:translateX(-14px)}to{transform:translateX(14px)}}

/* ===================== Layout & cards ===================== */
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:12px 0}
.card-title{font-size:1.08rem;font-weight:800;display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.card-title .pill{margin-inline-start:auto}
.sub-title{font-size:.92rem;font-weight:800;margin:14px 0 8px}

/* ===================== Buttons, pills, chips ===================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:800;padding:10px 16px;min-height:44px;transition:transform .12s;text-align:center}
.btn:active:not(:disabled){transform:scale(.96)}
.btn.ghost{background:var(--soft);color:var(--text)}
.btn.danger,.btn.armed{background:var(--bad);color:#fff}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.88rem;border-radius:12px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.icon-btn{display:inline-grid;place-items:center;flex:none;width:44px;height:44px;border:0;border-radius:50%;background:var(--soft);font-size:1.1rem;color:var(--text);transition:transform .12s}
.icon-btn:active:not(:disabled){transform:scale(.92)}
.icon-btn:disabled{opacity:.35}
.icon-btn.sm{width:36px;height:36px;font-size:.95rem}
.icon-btn svg{width:22px;height:22px}
.icon-btn.armed{width:auto;padding:0 10px;border-radius:12px;background:var(--bad);color:#fff;font-size:.82rem;font-weight:800}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn-row.tight{margin-top:6px;gap:6px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;background:var(--soft);font-size:.78rem;font-weight:800;white-space:nowrap}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.g-chip{display:inline-grid;place-items:center;flex:none;min-width:30px;height:30px;padding:0 6px;border-radius:10px;background:var(--chip-bg,var(--line));color:var(--chip-t,var(--muted));font-weight:800}

/* ===================== Header ===================== */
.hero{display:flex;align-items:center;gap:12px;padding:6px 2px 10px}
.trophy{width:54px;height:54px;flex:none;animation:bob 3.2s ease-in-out infinite;transform-origin:50% 90%}
.trophy-spark{animation:twinkle 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(-4deg)}}
@keyframes twinkle{50%{opacity:.25}}
.hero h1{font-size:1.5rem;font-weight:800;line-height:1.2}
.hero-txt p{color:var(--muted);font-size:.95rem}
.hero>.icon-btn{margin-inline-start:auto;background:var(--card);border:1px solid var(--line)}
.acct-btn{display:flex;align-items:center;gap:10px;width:100%;min-height:54px;padding:8px 12px;border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:var(--shadow);text-align:start}
.avatar{display:inline-grid;place-items:center;flex:none;width:38px;height:38px;border-radius:50%;background:var(--soft);font-size:1.35rem}
.avatar.sm{width:30px;height:30px;font-size:1.05rem}
.acct-name{font-weight:800}
.acct-sw{margin-inline-start:auto;color:var(--accent);font-weight:800;font-size:.88rem;white-space:nowrap}
.role-seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:10px 0 6px;padding:4px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.role-seg button{min-height:42px;border:0;border-radius:12px;background:transparent;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.role-seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.status{margin:4px 2px 8px;text-align:center;font-size:.84rem;color:var(--muted)}
.status.warn{color:var(--warn);font-weight:800}
.week-nav{display:flex;align-items:center;gap:8px;margin:8px 0}
.week-nav .icon-btn{background:var(--card);border:1px solid var(--line)}
.wk-label{flex:1;min-height:44px;border:1px solid var(--line);border-radius:14px;background:var(--card);font-weight:800}

/* ===================== Grade card ===================== */
.g-top{display:flex;align-items:center;gap:16px}
.badge-wrap{position:relative;flex:none}
.badge{display:grid;place-items:center;flex:none;width:86px;height:86px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 30% 24%,rgba(255,255,255,.55),transparent 48%),linear-gradient(160deg,var(--gc,var(--accent)),var(--gc2,var(--accent)));box-shadow:0 8px 18px rgba(0,0,0,.16),inset 0 -4px 0 rgba(0,0,0,.12)}
.badge svg{width:60%;height:60%}
.badge-letter{font-size:2.5rem;font-weight:800;line-height:1;color:var(--gt,#fff)}
.badge-img{width:100%;height:100%;object-fit:cover}
.badge.sm{width:40px;height:40px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.badge.sm .badge-letter{font-size:1.2rem}
.cam-btn{position:absolute;bottom:-2px;inset-inline-end:-6px;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:2px solid var(--card-solid);background:var(--accent);color:var(--on-accent);font-size:.85rem}
body:not(.is-sup) .sup-only{display:none}
.g-level{font-size:1.35rem;font-weight:800}
.g-pts{font-size:1.05rem;font-weight:800}
.g-cele{text-align:center;font-weight:800;color:var(--accent);opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s}
.g-cele.show{opacity:1;transform:none;margin-top:10px}
.g-lines{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:4px;font-size:.93rem}

/* progress bars: the fill slides in from the right (RTL) using transform only */
.bar{position:relative;height:12px;margin-top:14px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,var(--gc2,var(--accent)),var(--gc,var(--accent)));transform:translateX(100%);transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.bar.big{height:16px}
.bar.big>i{overflow:hidden}
.bar.big>i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-100%);animation:shimmer 2.4s ease-in-out infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
.bar.thin{height:6px;margin:0 16px 12px}
.bar.thin>i{background:var(--accent)}

/* ===================== Levels ===================== */
.levels{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.lv{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:16px}
.lv.current{background:var(--soft);border-color:var(--accent)}
.lv-head{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.lv-reward{display:block;font-size:.9rem}
.lv-input{margin-top:4px;min-height:38px!important;padding:6px 10px!important}

/* ===================== Day cards & task rows ===================== */
.day{margin:10px 0;border:1px solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);overflow:hidden}
.day.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--soft),var(--shadow)}
.day.future .day-head{opacity:.6}
.day-h{font-size:inherit;font-weight:inherit}
.day-head{display:flex;align-items:center;gap:8px;width:100%;min-height:54px;padding:12px 16px;border:0;background:none;text-align:start}
.day-name{font-weight:800}
.day-date{color:var(--muted);font-size:.9rem}
.day-pts{margin-inline-start:auto;font-weight:800}
.day-check{min-width:1.4em;text-align:center}
.chev{display:inline-block;transition:transform .2s;color:var(--muted)}
.day-head[aria-expanded="true"] .chev{transform:rotate(180deg)}
.day-body{padding:0 12px 12px}
.day-foot:empty{display:none}
.day-foot{margin-top:8px}
.empty{padding:6px 4px;color:var(--muted)}
.task{display:flex;align-items:center;gap:10px;width:100%;min-height:54px;margin:6px 0;padding:8px 10px;border:1px solid var(--line);border-radius:16px;background:var(--card-solid);text-align:start}
.task.st1{background:var(--warn-bg);border-color:transparent}
.task.st2{background:var(--ok-bg);border-color:transparent}
.task:disabled{opacity:.45}
.t-icon{display:grid;place-items:center;flex:none;width:40px;height:40px;border-radius:12px;background:var(--soft);font-size:1.45rem;overflow:hidden}
.t-icon.big{width:64px;height:64px;font-size:2.2rem;border-radius:18px}
.ic-img{width:100%;height:100%;object-fit:cover}
.t-name{flex:1;min-width:0;font-weight:800}
.t-pts{color:var(--muted);font-size:.9rem;font-weight:800}
.mark{display:grid;place-items:center;flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--line);font-weight:800;font-size:.95rem}
.task.st1 .mark{border-color:var(--warn);background:var(--card-solid)}
.task.st2 .mark{border-color:var(--ok);background:var(--ok);color:#fff}

/* ===================== Lists (shop, admin, board, dashboard) ===================== */
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.list>li{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:16px;background:var(--card-solid)}
.list.compact>li{padding:6px 10px;font-size:.9rem}
.board>li.me{border-color:var(--accent);background:var(--soft)}
.medal{min-width:1.8em;text-align:center;font-size:1.2rem;font-weight:800}
.pts{min-width:2.2em;text-align:center}
.dash-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.dash>li{align-items:flex-start}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-weight:800}
.game-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:10px}

/* ===================== Statistics ===================== */
.chart{display:flex;align-items:flex-end;gap:6px;padding:4px 0}
.sbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.sv{font-size:.75rem;font-weight:800}
.scol{position:relative;display:block;width:100%;max-width:34px;height:90px;border-radius:9px;background:var(--line);overflow:hidden}
.scol>i{position:absolute;inset:0;border-radius:inherit;background:var(--accent);transform:translateY(100%)}
.scol>i[data-g]{background:linear-gradient(var(--gc),var(--gc2))}
.sl{font-size:.7rem;color:var(--muted);white-space:nowrap}
.sbar.today .sl{color:var(--accent);font-weight:800}
.ach{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.ach li{padding:6px 11px;border-radius:99px;background:var(--ok-bg);font-weight:800;font-size:.85rem}
.ach li.locked{background:var(--line);color:var(--muted)}

/* ===================== Past weeks ===================== */
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wk-chip{display:grid;justify-items:center;gap:4px;padding:8px 4px;border:1px solid var(--line);border-radius:14px;background:var(--card-solid);font-size:.85rem}
.wk-chip.on{border-color:var(--accent);background:var(--soft)}

/* ===================== Forms & toggles ===================== */
details.sub{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
details.sub>summary{cursor:pointer;font-weight:800;min-height:36px;display:flex;align-items:center}
.fld{display:grid;gap:6px;margin:10px 0}
.fld>span{font-weight:800;font-size:.92rem}
input:not([type]),input[type="text"],textarea{width:100%;min-height:44px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card-solid)}
input:not([type]):focus,input[type="text"]:focus,textarea:focus{border-color:var(--accent)}
.set-row input,.stepper input{width:90px;flex:none;text-align:center;font-weight:800;font-size:1.1rem}
textarea{resize:vertical;min-height:76px;direction:ltr;text-align:left;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem}
textarea.copy-box{direction:rtl;text-align:right;font-family:inherit;font-size:.9rem}
.pin-input{-webkit-text-security:disc;letter-spacing:.3em}
.switch{display:flex;align-items:center;gap:10px;min-height:40px;margin-top:8px;cursor:pointer;font-weight:800}
.switch input{appearance:none;-webkit-appearance:none;position:relative;flex:none;width:48px;height:28px;margin:0;border-radius:99px;background:var(--line);cursor:pointer}
.switch input::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(-20px)}
.stepper{display:flex;align-items:center;gap:8px}
.tf-prev{display:flex;align-items:center;gap:12px}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emo{display:grid;place-items:center;aspect-ratio:1;min-height:38px;border:2px solid transparent;border-radius:12px;background:var(--soft);font-size:1.3rem;padding:0}
.emo[aria-pressed="true"]{border-color:var(--accent);background:var(--ok-bg)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:40px;padding:6px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card-solid);font-weight:800}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.opt.swatch{width:40px;height:40px;padding:0;border-radius:50%;border-width:3px}
.opt.swatch[aria-pressed="true"]{border-color:var(--text)}
.color-pick{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.color-pick input{width:34px;height:28px;padding:0;border:0;background:none;cursor:pointer}
.opt.pat{display:grid;justify-items:center;gap:4px;padding:6px;font-size:.75rem}
.pat-prev{display:block;width:46px;height:30px;border-radius:8px;border:1px solid var(--line);background-color:var(--bg1);background-size:20px 20px}
.set{padding:12px 0;border-top:1px solid var(--line)}
.set:first-child{border-top:0;padding-top:0}
.set h3{font-size:1rem;font-weight:800;margin-bottom:8px}
.set .muted.sm{margin:8px 0 6px}
.acct-row{display:flex;align-items:center;gap:10px;flex:1;min-width:0;min-height:50px;padding:4px;border:0;background:none;text-align:start}
.acct-row.on .avatar{box-shadow:0 0 0 2px var(--accent)}
.badge-prev{width:128px;height:128px;border-radius:50%;object-fit:cover;margin:6px auto;display:block}

/* ===================== Modal ===================== */
.modal-ov{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom));background:rgba(8,18,22,.5);opacity:0;transition:opacity .2s}
.modal-ov.show{opacity:1}
.modal{width:100%;max-width:520px;max-height:88vh;max-height:88dvh;overflow:auto;overscroll-behavior:contain;padding:16px 16px 20px;border-radius:24px;background:var(--card-solid);color:var(--text);box-shadow:0 24px 60px rgba(0,0,0,.3);transform:translateY(24px);transition:transform .25s}
.modal:focus{outline:none}
.modal-ov.show .modal{transform:none}
.modal-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.modal-head h2{flex:1;font-size:1.15rem;font-weight:800}

.pin-dots{display:flex;justify-content:center;gap:14px;margin:16px 0 6px}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent);transition:transform .15s}
.pin-dots i.on{background:var(--accent);transform:scale(1.12)}
.pin-err{min-height:1.5em;margin:4px 0 8px;text-align:center;color:var(--bad);font-weight:800}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:290px;margin:0 auto}
.pinpad button{min-height:56px;border:0;border-radius:16px;background:var(--soft);font-size:1.4rem;font-weight:800}
.pinpad button:active{transform:scale(.95)}

/* ===================== Toast & confetti ===================== */
.toast{position:fixed;z-index:80;left:50%;bottom:max(16px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;width:max-content;max-width:min(92vw,480px);padding-block:10px;padding-inline:16px 10px;border-radius:16px;background:#17282a;color:#fff;box-shadow:0 12px 30px rgba(0,0,0,.28);transform:translate(-50%,160%);opacity:0;transition:transform .25s,opacity .25s}
.toast:not(.show){pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast-msg{flex:1}
.toast-undo{flex:none;min-height:36px;padding:6px 12px;border:0;border-radius:10px;background:rgba(255,255,255,.16);color:#ffe08a;font-weight:800}
.confetti{position:fixed;inset:0;z-index:90;overflow:hidden;pointer-events:none}
.confetti i{position:absolute;top:-16px;width:8px;height:14px;border-radius:2px;transform:rotate(var(--r));animation:fall 2.4s cubic-bezier(.25,.6,.4,1) forwards}
@keyframes fall{to{transform:translate3d(var(--dx),108vh,0) rotate(calc(var(--r) + 720deg))}}

/* ===================== Game overlay ===================== */
.game-ov{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:#0e1233;touch-action:none;-webkit-user-select:none;user-select:none}
.game-ov:focus{outline:none}
.game-box{position:relative}
#gameCv{display:block}
.game-hint{position:absolute;left:0;right:0;top:60%;text-align:center;color:#fff;font-weight:800;font-size:1.1rem;text-shadow:0 2px 6px rgba(0,0,0,.55);pointer-events:none}
.game-hint small{display:block;font-weight:500;font-size:.85rem;opacity:.9}
.game-panel{position:absolute;inset:0;width:min(290px,86%);height:fit-content;margin:auto;padding:20px;border-radius:22px;background:var(--card-solid);color:var(--text);text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.4);display:grid;gap:6px}
.gp-title{font-size:1.3rem;font-weight:800}
.gp-new{color:var(--accent);font-weight:800}
.game-panel .btn-row{justify-content:center}
.game-x{position:absolute;top:10px;inset-inline-end:10px;background:rgba(255,255,255,.22);color:#fff}

/* ===================== Footer ===================== */
.foot{margin:18px 4px 6px;text-align:center;color:var(--muted);font-size:.8rem;display:grid;gap:4px}

/* ===================== Reduced motion (the background follows the user's own setting) ===================== */
@media (prefers-reduced-motion:reduce){
  #app *,#app *::before,#app *::after,.modal-ov,.modal,.modal *,.toast,.toast *{animation:none!important;transition:none!important}
}

const RX = {

const vText = (v, max) => { if (typeof v !== 'string') return null; const t = v.trim(); return t && t.length <= max && !RX.ctrl.test(t) ? t : null; };

const vCells = (r) => Array.isArray(r) && r.length === 7 && r.every((x) => x === 0 || x === 1 || x === 2);
const vPin = (v) => typeof v === 'string' && RX.pin.test(v);

/** A task or a shop item: { id, text, icon, pts|cost, img? }. */
function cleanItem(t, numKey, numMax) {
  if (!isObj(t)) return null;
  const id = vInt(t.id, 1, 1e9), text = vText(t.text, LIMITS.text), icon = vIcon(t.icon), num = vInt(t[numKey], 1, numMax);
  if (id === null || !text || !icon || num === null) return null;
  const item = { id, text, icon, [numKey]: num };
  if (t.img !== undefined && t.img !== null) { const im = vImg(t.img); if (!im) return null; item.img = im; }

function cleanClaim(c, accIds) {

/* ===================== 4. Scoring rules ===================== */
const isActive = (t, d) => !t.days || t.days[d] === 1;

}

  if (!Object.keys(w).length) delete a[wk];

}

const baseMax = () => sum(S.tasks.map((t) => t.pts * activeDays(t)));
/** sum(pts × active days) + bonus (0 when there is nothing to do). */

/** ceil(minPct × max / 100) with exact integer math. */
const pointsFor = (k, max) => Math.floor((GRADES[gRank(k)].min * max + 99) / 100);

function score(acc, wk) {

  for (const t of S.tasks) {
    for (let d = 0; d < 7; d++) {
      if (!isActive(t, d)) continue;
      cells++;
      const st = cellOf(acc, wk, t.id, d);
      if (st === 2) { total += t.pts; approved++; } else if (st === 1) pending++;
    }
  }
  const bonus = cells > 0 && approved === cells;
  if (bonus) total += S.bonus;

}
function nextHint(sc) {

}

    n++; max += t.pts;
    const st = cellOf(acc, wk, t.id, d);

    n++;
    if (cellOf(acc, wk, t.id, d) !== 2) return false;

function streaks(acc) {

/** Shop balance: every week's total minus every claim (pending + done). May be negative internally. */

const modals = [];

/* --- PIN pad: 4 dots + on-screen keypad (also accepts keyboard digits, incl. Arabic digits) --- */
const pinGuard = { fails: 0, until: 0 };

}

function checkPin(expected, v, pad) {

  if (++pinGuard.fails >= 5) { pinGuard.fails = 0; pinGuard.until = now + 30000; pad.error('محاولات كثيرة — انتظر 30 ثانية'); }

  return false;
}

/* --- Images from the gallery: square crop + resize on a canvas → JPEG 0.8 data URL (validated) --- */

}
async function squareImage(file, size) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; });
    const s = Math.min(img.naturalWidth, img.naturalHeight);
    if (!s) throw new Error('empty image');
    const cv = document.createElement('canvas');
    cv.width = cv.height = size;
    const cx = cv.getContext('2d');
    cx.fillStyle = '#fff';
    cx.fillRect(0, 0, size, size);
    cx.imageSmoothingQuality = 'high';
    cx.drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, size, size);
    const data = cv.toDataURL('image/jpeg', 0.8);
    if (!vImg(data)) throw new Error('invalid image');
    return data;
  } finally { URL.revokeObjectURL(url); }
}

/** Clipboard with a hidden-textarea fallback. Resolves to true/false. */
async function copyText(text) {
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; } } catch (_) { /* fall back */ }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
  document.body.appendChild(ta);
  ta.select();
  ta.setSelectionRange(0, text.length);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
  ta.remove();
  return ok;
}

function renderStats() {
  const acc = curAcc().id, wk = viewWk;
  const days = DAYS.map((_, d) => dayStats(acc, wk, d));
  const top = Math.max(1, ...days.map((x) => x.max));
  const dayBars = days.map((x, d) => `<div class="sbar${isThisWeek() && d === today.getDay() ? ' today' : ''}"><span class="sv">${x.pts}</span><span class="scol"><i style="transform:translateY(${barX(x.pts, top)}%)"></i></span><span class="sl">${DAYS_S[d]}</span></div>`).join('');
  const cw = fromISO(thisWk()), weeks = [];
  for (let i = 7; i >= 0; i--) { const ws = addDays(cw, -7 * i), k = isoOf(ws); weeks.push({ ws, k, has: !!(S.aw[acc] && S.aw[acc][k]), sc: score(acc, k) }); }
  const wkBars = weeks.map((w) => `<div class="sbar${w.k === wk ? ' today' : ''}"><span class="sv">${w.has ? w.sc.grade : '—'}</span><span class="scol"><i data-g="${w.sc.grade}" style="transform:translateY(${w.has ? 100 - w.sc.pct : 100}%)"></i></span><span class="sl">${dm(w.ws)}</span></div>`).join('');
  const dayAria = days.map((x, d) => `${DAYS[d]} ${x.pts}`).join('، ');
  const wkAria = weeks.map((w) => `${dm(w.ws)}: ${w.has ? `${w.sc.grade} ${w.sc.pct}%` : 'لا بيانات'}`).join('، ');
  const ach = achievements(acc, streakOf(acc));
  $('#stats').innerHTML = `<h2 class="card-title">📊 الإحصائيات</h2>
    <h3 class="sub-title">نقاط كل يوم (${weekLabel(wk)})</h3><div class="chart" role="img" aria-label="${esc(`نقاط كل يوم: ${dayAria}`)}">${dayBars}</div>
    <h3 class="sub-title">آخر 8 أسابيع</h3><div class="chart" role="img" aria-label="${esc(`آخر 8 أسابيع: ${wkAria}`)}">${wkBars}</div>
    <h3 class="sub-title">🏅 الإنجازات</h3><ul class="ach">${ach.map((a) => `<li class="${a.ok ? '' : 'locked'}"><span aria-hidden="true">${a.ok ? a.icon : '🔒'}</span> ${a.n}<span class="sr-only">${a.ok ? ' — مفتوح' : ' — مقفل'}</span></li>`).join('')}</ul>
    <div class="btn-row"><button type="button" class="btn ghost" data-act="copySum" data-fk="copySum">📋 نسخ ملخص الأسبوع</button></div>`;
}

/* ===================== 7. Actions ===================== */
const snapshot = () => JSON.stringify(S);
function restoreSnapshot(snap) {
  S = JSON.parse(snap);
  if (!acctById(P.cur)) P.cur = 'a1';
  save(); savePrefs(); renderAll();
}
/** Config change with one-tap undo (whole-state snapshot). */
function withUndo(msg, change) {
  const snap = snapshot();
  change();
  save(); renderAll();
  toast(saveFailed ? '⚠️ المساحة ممتلئة — لم يُحفظ التغيير' : msg, () => restoreSnapshot(snap));
}

/* --- celebrations: grade went up, or every task of today just got approved --- */
function beforeChange() {
  const acc = curAcc().id;
  return { acc, wk: viewWk, grade: score(acc, viewWk).grade, today: dayDone(acc, today) === true };
}
function celebrate(b) {
  const acc = curAcc().id;
  if (!b || b.acc !== acc || b.wk !== viewWk) return;
  const g = score(acc, viewWk).grade;
  if (gRank(g) < gRank(b.grade)) party(`🎉 وصلت للمستوى ${g}!`);
  else if (!b.today && dayDone(acc, today) === true) party('🎉 أنجزت كل مهام اليوم!');
}
let partyTimer = 0;
function party(text) {
  const el = $('#gCele');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(partyTimer);
  partyTimer = setTimeout(() => { el.classList.remove('show'); el.textContent = ''; }, 3400);
  confetti();
  vibrate([40, 60, 40]);
}

/* --- task cells --- */
function tapCell(tid, d) {
  const t = S.tasks.find((x) => x.id === tid), wk = viewWk, acc = curAcc().id;
  if (!t || !isActive(t, d) || isFuture(wk, d)) return;
  const st = cellOf(acc, wk, tid, d);
  let nv;
  if (role === 'sup') nv = st === 2 ? 0 : 2;
  else if (st === 2) { toast('✓ هذه المهمة معتمدة — المشرف فقط يقدر يغيّرها'); return; }
  else nv = st === 1 ? 0 : 1;
  const b = beforeChange();
  setCell(acc, wk, tid, d, nv);
  save(); patchCell(d, tid); renderMeta(); celebrate(b);
  const msg = role === 'sup'
    ? (nv === 2 ? `✓ اعتماد «${t.text}» +${t.pts}` : `↩️ إلغاء اعتماد «${t.text}»`)
    : (nv === 1 ? `⏳ «${t.text}» بانتظار اعتماد المشرف` : `↩️ إلغاء «${t.text}»`);
  toast(saveFailed ? '⚠️ المساحة ممتلئة — لم يُحفظ التغيير' : msg, () => {
    if (cellOf(acc, wk, tid, d) !== nv) return;
    setCell(acc, wk, tid, d, st);
    save();
    if (acc === curAcc().id && wk === viewWk) { patchCell(d, tid); renderMeta(); } else renderAll();
  });
}
/** Approve pending cells [acc, wk, tid, d] and pending claims; undo puts them back to pending. */
function bulkSet(cells, claimIds, msg) {
  const b = beforeChange(), imgs = {};
  cells.forEach(([a, w, t, d]) => setCell(a, w, t, d, 2));
  claimIds.forEach((id) => { const c = S.claims[id]; if (c.img) imgs[id] = c.img; c.status = 'done'; delete c.img; });
  save(); renderAll(); celebrate(b);
  toast(msg, () => {
    cells.forEach(([a, w, t, d]) => { if (cellOf(a, w, t, d) === 2) setCell(a, w, t, d, 1); });
    claimIds.forEach((id) => { const c = S.claims[id]; if (c && c.status === 'done') { c.status = 'pending'; if (imgs[id]) c.img = imgs[id]; } });
    save(); renderAll();
  });
}
function approveDay(d) {
  const acc = curAcc().id, wk = viewWk;
  const cells = S.tasks.filter((t) => isActive(t, d) && cellOf(acc, wk, t.id, d) === 1).map((t) => [acc, wk, t.id, d]);
  if (cells.length) bulkSet(cells, [], `✓ تم اعتماد ${cells.length} مهام ليوم ${DAYS[d]}`);
}
function approveAccounts(ids) {
  const cells = [], claimIds = [];
  for (const acc of ids) {
    const weeks = S.aw[acc] || {};
    for (const wk of Object.keys(weeks)) for (const t of S.tasks) {
      const r = weeks[wk]['t' + t.id];
      if (r) for (let d = 0; d < 7; d++) if (r[d] === 1 && isActive(t, d)) cells.push([acc, wk, t.id, d]);
    }
    for (const [id, c] of Object.entries(S.claims)) if (c.acc === acc && c.status === 'pending') claimIds.push(id);
  }
  if (!cells.length && !claimIds.length) { toast('لا يوجد شيء معلّق 👍'); return; }
  bulkSet(cells, claimIds, `✓ تم اعتماد ${cells.length + claimIds.length} عنصر`);
}

/* --- rewards shop --- */
function addClaim(xid, status) {
  const x = S.extras.find((e) => e.id === xid), acc = curAcc().id;
  if (!x) return;
  if (balanceRaw(acc) < x.cost) { toast('رصيدك ما يكفي بعد — كمّل مهامك 💪'); return; }
  const id = uid('c');
  S.claims[id] = { acc, name: x.text, icon: x.icon, cost: x.cost, status, ts: Date.now(), ...(x.img && status === 'pending' ? { img: x.img } : {}) };
  save(); renderMeta();
  const msg = status === 'pending' ? `🛍️ طلبت «${x.text}» — بانتظار موافقة المشرف` : `🎁 تم منح «${x.text}» (−${x.cost} نقطة)`;
  toast(msg, () => { if (S.claims[id] && S.claims[id].status === status) { delete S.claims[id]; save(); renderMeta(); } });
}
function approveClaim(id) {
  const c = S.claims[id];
  if (!c || c.status !== 'pending') return;
  const img = c.img;
  c.status = 'done';
  delete c.img;
  save(); renderMeta();
  toast(`✓ تمت الموافقة على «${c.name}»`, () => { if (S.claims[id] === c && c.status === 'done') { c.status = 'pending'; if (img) c.img = img; save(); renderMeta(); } });
}
function removeClaim(id, msg) {
  const c = S.claims[id];
  if (!c || c.status !== 'pending') return;
  delete S.claims[id];
  save(); renderMeta();
  toast(msg.replace('%', c.name), () => { if (!S.claims[id]) { S.claims[id] = c; save(); renderMeta(); } });
}

/* --- navigation, role, inline settings --- */
function goWeek(wk) {
  if (!vWeek(wk) || wk > thisWk()) return;
  viewWk = wk;
  openDays = isThisWeek() ? new Set([today.getDay()]) : new Set();
  renderAll();
}
function toggleDay(d, btn) {
  const open = !openDays.has(d);
  if (open) openDays.add(d); else openDays.delete(d);
  btn.setAttribute('aria-expanded', String(open));
  $(`#dayBody${d}`).hidden = !open;
}
function setRole(r) {
  if (r === role) return;
  const go = () => { role = r; renderAll(); toast(r === 'sup' ? '🔓 وضع المشرف — كل أدوات التعديل ظاهرة' : '👦 وضع «أنا»'); };
  if (r === 'sup') askSupPin(go); else go();
}
function saveReward(el) {
  const g = el.dataset.g, v = vText(el.value, LIMITS.reward);
  if (!v) { el.value = S.rewards[g]; toast('⚠️ اكتب الجائزة (حتى 60 حرفًا)'); return; }
  if (v !== S.rewards[g]) withUndo(`✓ تم حفظ جائزة المستوى ${g}`, () => { S.rewards[g] = v; });
}
function saveBonus(el) {
  const v = vInt(parseInt(normDigits(el.value), 10), 0, LIMITS.bonus);
  if (v === null) { el.value = S.bonus; toast(`⚠️ المكافأة رقم من 0 إلى ${LIMITS.bonus}`); return; }
  if (v !== S.bonus) withUndo(`✓ مكافأة الأسبوع الكامل صارت ${v} نقطة`, () => { S.bonus = v; });
}
function setGameLock(on) { withUndo(on ? '🔒 اللعبة تفتح بعد إنجاز مهام اليوم' : '🔓 اللعبة مفتوحة دائمًا', () => { S.gameLock = on; }); }

function weekSummary() {
  const a = curAcc(), sc = score(a.id, viewWk), st = streaks(a.id);
  const lines = [`📊 تقييمي الأسبوعي — ${a.name}`, `📅 الأسبوع: ${weekLabel(viewWk)}`, `🏅 المستوى: ${sc.grade} (${sc.pct}%)`, `⭐ النقاط: ${sc.total} من ${sc.max}`, `🎁 الجائزة: ${S.rewards[sc.grade]}`];
  if (sc.bonus) lines.push(`💯 مكافأة الأسبوع الكامل: +${S.bonus}`);
  lines.push(`🔥 السلسلة: ${st.cur} يوم · الأفضل: ${st.best}`, '', 'المهام:');
  for (const t of S.tasks) {
    const n = activeDays(t);
    if (!n) continue;
    let ok = 0;
    for (let d = 0; d < 7; d++) if (isActive(t, d) && cellOf(a.id, viewWk, t.id, d) === 2) ok++;
    lines.push(`${t.icon} ${t.text}: ${ok}/${n}`);
  }
  return lines.join('\n');
}
async function copySummary() {
  const text = weekSummary();
  if (await copyText(text)) toast('📋 تم نسخ ملخص الأسبوع'); else showTextModal('📋 ملخص الأسبوع', text);
}

/* ===================== 8. PINs, accounts, linking & transfer codes ===================== */
function askSupPin(onOk, msg) {
  if (!S.pin) { createPin(onOk, 'أنشئ رمز المشرف'); return; }
  openModal({
    title: '🔒 رمز المشرف',
    html: `<p class="center">${esc(msg || 'أدخل رمز المشرف (4 أرقام)')}</p>${pinPadHTML()}<p class="note">${esc(PIN_NOTE)}</p>`,
    onMount(body, m) { mountPinPad(body, (v, pad) => { if (checkPin(S.pin, v, pad)) { closeModal(m); onOk(); } }); },
  });
}
/** Create / change the supervisor PIN (entered twice). */
function createPin(onOk, title) {
  let first = null;
  openModal({
    title: `🔑 ${title}`,
    html: `<p class="center pin-step">اختر رمزًا من 4 أرقام</p>${pinPadHTML()}<p class="note">${esc(PIN_NOTE)}</p>`,
    onMount(body, m) {
      const step = $('.pin-step', body);
      mountPinPad(body, (v, pad) => {
        if (first === null) { first = v; pad.clear(); step.textContent = 'أعد إدخال الرمز للتأكيد'; return; }
        if (v !== first) { first = null; step.textContent = 'اختر رمزًا من 4 أرقام'; pad.error('الرمزان غير متطابقين — ابدأ من جديد'); return; }
        S.pin = v;
        save(); closeModal(m);
        toast('✓ تم حفظ رمز المشرف');
        if (onOk) onOk();
      });
    },
  });
}
function askAccountPin(a, onOk, msg) {
  openModal({
    title: `🔒 ${a.name}`,
    html: `<p class="center">${esc(msg || `أدخل رمز حساب «${a.name}»`)}</p>${pinPadHTML()}`,
    onMount(body, m) { mountPinPad(body, (v, pad) => { if (checkPin(a.pin, v, pad)) { closeModal(m); onOk(); } }); },
  });
}

/* --- accounts modal --- */
function openAccounts() {
  openModal({
    title: '👥 الحسابات',
    html: '<div class="acct-modal"></div>',
    onMount(body) {
      const box = $('.acct-modal', body);
      const draw = () => { box.innerHTML = acctModalHTML(); };
      draw();
      box.addEventListener('click', (e) => {
        const b = e.target.closest('button');
        if (!b || b.disabled) return;
        if (b.dataset.sw) switchAccount(b.dataset.sw);
        else if (b.dataset.del) twoTap(b, 'حذف؟', () => { deleteAccount(b.dataset.del); draw(); });
        else if (b.dataset.new) openAccountForm(null, draw);
        else if (b.dataset.edit) openAccountForm(curAcc(), draw);
        else if (b.dataset.tx) showTransfer(box);
        else if (b.dataset.imp) importTransfer(b, box);
      });
    },
  });
}
function acctModalHTML() {
  const sup = role === 'sup';
  const rows = S.accts.map((a) => {
    const p = pendingOf(a.id), on = a.id === P.cur;

/* --- transfer code for ONE account ("WGA1:" + base64 JSON) --- */
function makeTransfer(accId) {
  const a = acctById(accId);
  const obj = {
    app: 'weekly-grades', kind: 'acct', v: 1, ts: Date.now(),
    acct: { name: a.name, icon: a.icon, ...(a.pin ? { pin: a.pin } : {}) },
    tasks: S.tasks.map((t) => ({ id: t.id, text: t.text })),
    aw: S.aw[accId] || {},
    claims: Object.values(S.claims).filter((c) => c.acc === accId).map(({ acc: _acc, ...c }) => c),
  };
  return 'WGA1:' + b64enc(JSON.stringify(obj));
}
function showTransfer(box) {
  const out = $('#txOut', box);
  out.value = makeTransfer(P.cur);
  out.hidden = false;
  out.select();
  copyText(out.value).then((ok) => toast(ok ? '📋 تم نسخ رمز النقل' : 'انسخ الرمز من المربع'));
}
/** Validates a transfer code and maps its tasks to this device's tasks by name. Throws when invalid. */
function parseTransfer(text) {
  text = String(text || '').trim();
  if (!text.startsWith('WGA1:') || text.length > 6e6) throw new Error('format');
  const o = JSON.parse(b64dec(text.slice(5).replace(/\s+/g, '')));
  if (!isObj(o) || o.app !== 'weekly-grades' || o.kind !== 'acct' || o.v !== 1 || !isObj(o.acct) || !Array.isArray(o.tasks) || !isObj(o.aw) || !Array.isArray(o.claims)) throw new Error('structure');
  const name = vText(o.acct.name, LIMITS.name), icon = vIcon(o.acct.icon);
  if (!name || !icon || (o.acct.pin !== undefined && !vPin(o.acct.pin)) || o.tasks.length > 60 || o.claims.length > LIMITS.claims) throw new Error('fields');
  const map = {};
  for (const t of o.tasks) {
    const text2 = isObj(t) && vInt(t.id, 1, 1e9) !== null ? vText(t.text, LIMITS.text) : null;
    if (!text2) throw new Error('task');
    const local = S.tasks.find((x) => x.text === text2);
    if (local) map['t' + t.id] = 't' + local.id;
  }
  let bad = 0;
  const weeks = cleanWeeks(o.aw, null, () => { bad++; });
  if (bad) throw new Error('weeks');
  const aw = {};
  let dropped = 0;
  for (const [wk, w] of Object.entries(weeks)) {
    for (const [k, r] of Object.entries(w)) {
      const nk = map[k];
      if (!nk) { dropped++; continue; }
      const row = (aw[wk] || (aw[wk] = {}))[nk] || r.slice();
      aw[wk][nk] = row.map((v, i) => Math.max(v, r[i]));
    }
  }
  const claims = o.claims.map((c) => cleanClaim(c, null));
  if (claims.some((c) => !c)) throw new Error('claims');
  return { name, icon, pin: o.acct.pin, aw, claims, dropped };
}
function importTransfer(btn, box) {
  const msg = $('#txMsg', box);
  let r;
  try { r = parseTransfer($('#txIn', box).value); } catch (_) {
    msg.className = 'msg err';
    msg.textContent = '❌ رمز النقل غير صالح — لم يتغير شيء.';
    return;
  }
  const clash = S.accts.find((a) => a.name === r.name);
  if (!clash && S.accts.length >= LIMITS.accts) { msg.className = 'msg err'; msg.textContent = 'وصلت للحد الأقصى من الحسابات.'; return; }
  const apply = () => { closeAllModals(); applyTransfer(r, clash); };
  if (!clash) { apply(); return; }
  msg.className = 'msg';
  msg.textContent = `يوجد حساب باسم «${r.name}» — سيُستبدل تقدّمه وطلباته بالبيانات المستوردة.`;
  twoTap(btn, 'اضغط مرة ثانية للاستبدال', apply);
}
function applyTransfer(r, target) {
  const snap = snapshot();
  let a = target && acctById(target.id);
  if (a) {
    for (const [cid, c] of Object.entries(S.claims)) if (c.acc === a.id) delete S.claims[cid];
    a.icon = r.icon;
    if (r.pin) a.pin = r.pin; else delete a.pin;
  } else {
    a = { id: uid('a'), name: r.name, icon: r.icon, ...(r.pin ? { pin: r.pin } : {}) };
    S.accts.push(a);
  }
  if (Object.keys(r.aw).length) S.aw[a.id] = r.aw; else delete S.aw[a.id];
  for (const c of r.claims) S.claims[uid('c')] = { acc: a.id, ...c };
  save(); renderAll();
  toast(`📥 تم استيراد «${r.name}»${r.dropped ? ` — تجاهلنا ${r.dropped} مهمة غير موجودة هنا` : ''}`, () => restoreSnapshot(snap));
}

      });

    },

/** Deleting a task also removes its marks from every week (the confirmation says so; undo brings all back). */
function deleteTask(id) {
  const t = S.tasks.find((x) => x.id === id);
  if (!t) return;
  withUndo(`🗑️ حُذفت «${t.text}»`, () => {
    S.tasks = S.tasks.filter((x) => x.id !== id);
    for (const acc of Object.keys(S.aw)) {
      for (const wk of Object.keys(S.aw[acc])) {
        delete S.aw[acc][wk]['t' + id];
        if (!Object.keys(S.aw[acc][wk]).length) delete S.aw[acc][wk];
      }
      if (!Object.keys(S.aw[acc]).length) delete S.aw[acc];
    }
  });
}
function deleteExtra(id) {
  const x = S.extras.find((e) => e.id === id);
  if (x) withUndo(`🗑️ حُذفت «${x.text}»`, () => { S.extras = S.extras.filter((e) => e.id !== id); });
}

/* ===================== 10. Settings & theme (per device) ===================== */
function hsl2rgb(h, s, l) {

    return { x: prev ? prev.x + SPACING : W + 30, gy, passed: false, seed: ++seedN };
  }
  const circRect = (x, y, r, rx, ry, rw, rh) => { const dx = x - clamp(x, rx, rx + rw), dy = y - clamp(y, ry, ry + rh); return dx * dx + dy * dy < r * r; };
  function hits(t) {
    if (t.x > bird.x + R || t.x + TW < bird.x - R) return false;
    const top = t.gy - GAP / 2, bot = t.gy + GAP / 2, r = R - 2;
    return circRect(bird.x, bird.y, r, t.x, -100, TW, top + 100) || circRect(bird.x, bird.y, r, t.x, bot, TW, GROUND - bot);
  }
  function scrollWorld(dx) {
    groundOff += dx; farOff += dx * 0.18; midOff += dx * 0.42;
    for (const c of clouds) { c.x -= dx * 0.12; if (c.x < -70) { c.x = W + 70; c.y = 40 + Math.random() * 170; } }
  }
  function crash() {
    stage = 'dying';
    bird.vy = Math.max(bird.vy, 120);
    beep(160, 0.32, 'sawtooth', 0.06);
    vibrate(160);
    newBest = points > (P.best[acc] || 0);
    if (newBest) { P.best[acc] = points; savePrefs(); }
  }
  function showPanel() {
    if (stage !== 'over' || ov.hidden) return;
    $('#gpScore').textContent = String(points);
    $('#gpBest').textContent = String(P.best[acc] || 0);
    $('#gpNew').hidden = !newBest;
    $('#gamePanel').hidden = false;
    $('#gpAgain').focus({ preventScroll: true });
  }
  function update(dt) {
    clock += dt;
    if (stage === 'over') return;
    if (stage === 'ready') { bird.y = 250 + Math.sin(clock * 3) * 8; bird.wing += dt * 9; scrollWorld(70 * dt); return; }
    bird.vy += GRAV * dt;
    bird.y += bird.vy * dt;
    bird.rot = clamp(bird.vy / 650, -0.45, 1.25);
    if (bird.y < R) { bird.y = R; bird.vy = 0; }
    if (stage === 'dying') {
      if (bird.y + R >= GROUND) { bird.y = GROUND - R; stage = 'over'; setTimeout(showPanel, 350); }
      return;
    }
    bird.wing += dt * 16;
    speed = Math.min(200, 130 + points * 3);
    const dx = speed * dt;
    scrollWorld(dx);
    for (const t of towers) {
      t.x -= dx;
      if (!t.passed && t.x + TW < bird.x - R) { t.passed = true; points++; beep(920, 0.08, 'triangle', 0.04); }
    }
    while (towers.length && towers[0].x < -TW - 12) towers.shift();
    const lastT = towers[towers.length - 1];
    if (!lastT || lastT.x <= W - SPACING) towers.push(newTower(lastT));
    if (towers.some(hits)) crash();
    else if (bird.y + R >= GROUND) { bird.y = GROUND - R; crash(); }
  }
  function frame(now) {
    raf = requestAnimationFrame(frame);
    const dt = Math.min(0.033, Math.max(0, (now - last) / 1000));
    last = now;
    update(dt);
    draw();
  }

  /* --- drawing --- */
  const ell = (x, y, rx, ry) => { cx.moveTo(x + rx, y); cx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); };
  const circle = (x, y, r) => { cx.beginPath(); cx.arc(x, y, r, 0, Math.PI * 2); cx.fill(); };
  function drawLayer(img, off) {
    const o = off % img.len;
    for (let k = 0; k < 2; k++) cx.drawImage(img.c, 0, 0, img.c.width, img.c.height, k * img.len - o, GROUND - img.top, img.len, img.top);
  }
  function drawTower(x, y, h, seed, hanging) {
    if (h <= 0) return;
    const g = cx.createLinearGradient(x, 0, x + TW, 0);
    g.addColorStop(0, '#26335f'); g.addColorStop(0.55, '#3c5090'); g.addColorStop(1, '#222d58');
    cx.fillStyle = g;
    cx.fillRect(x, y, TW, h);
    const r = rng(seed);
    for (let wy = hanging ? y + h - 28 : y + 20; hanging ? wy > y + 2 : wy < y + h - 10; wy += hanging ? -15 : 15) {
      for (let c = 0; c < 3; c++) { cx.fillStyle = r() > 0.42 ? '#ffd56e' : 'rgba(10,18,46,.6)'; cx.fillRect(x + 9 + c * 15, wy, 10, 8); }
    }
    cx.fillStyle = '#1a244b';
    cx.fillRect(x - 4, hanging ? y + h - 12 : y, TW + 8, 12);
    if (!hanging) {
      cx.fillRect(x + TW / 2 - 1.5, y - 9, 3, 9);
      cx.fillStyle = Math.floor(clock * 2) % 2 ? '#ff5a5a' : '#ffb0b0';
      circle(x + TW / 2, y - 10, 2.6);
    }
  }
  function dune(y0, amp, freq, off, color) {
    cx.beginPath();
    cx.moveTo(0, H);
    for (let x = 0; x <= W; x += 10) cx.lineTo(x, y0 + Math.sin((x + off) * freq) * amp);
    cx.lineTo(W, H);
    cx.closePath();
    cx.fillStyle = color;
    cx.fill();
  }
  function drawBird() {
    const b = bird;
    cx.save();
    cx.translate(b.x, b.y);
    cx.rotate(b.rot);
    cx.fillStyle = '#5a3418'; // tail
    cx.beginPath(); cx.moveTo(-12, -2); cx.lineTo(-25, -8); cx.lineTo(-24, 6); cx.closePath(); cx.fill();
    cx.fillStyle = '#8a5528'; cx.beginPath(); ell(0, 0, 16, 12); cx.fill(); // body
    cx.fillStyle = '#f3e3c3'; cx.beginPath(); ell(3, 4.5, 10, 6.5); cx.fill(); // cream belly
    cx.fillStyle = '#b98a5a';
    for (const [x, y] of [[0, 4], [4, 7], [7, 3]]) { cx.beginPath(); ell(x, y, 1.6, 1); cx.fill(); }
    cx.fillStyle = '#8a5528'; circle(10, -6, 8.5); // head
    cx.fillStyle = '#3a2414'; // dark crown
    cx.beginPath(); cx.arc(10, -6, 8.5, Math.PI * 1.05, Math.PI * 1.95); cx.closePath(); cx.fill();
    cx.fillStyle = '#f3e3c3'; cx.beginPath(); ell(13, -2.5, 4.5, 3.4); cx.fill(); // cheek
    cx.fillStyle = '#3a2414'; cx.fillRect(10.4, -4.5, 2, 6); // falcon "tear" stripe
    cx.fillStyle = '#fff'; circle(13.2, -8, 3);
    cx.fillStyle = '#111'; circle(14, -8, 1.6);
    cx.fillStyle = '#f2b632'; // golden hooked beak
    cx.beginPath(); cx.moveTo(17, -8.5); cx.quadraticCurveTo(25.5, -6.5, 21.5, -1); cx.lineTo(17.5, -3.5); cx.closePath(); cx.fill();
    cx.save(); // flapping wing
    cx.translate(-2, -2);
    cx.rotate(-0.3 + Math.sin(b.wing) * 0.7);
    cx.fillStyle = '#6b3f1d'; cx.beginPath(); ell(-7, 0, 13, 6.5); cx.fill();
    cx.fillStyle = '#4f2d13'; cx.beginPath(); ell(-13, 1, 6, 3.4); cx.fill();
    cx.restore();
    cx.restore();
  }
  function draw() {
    cx.fillStyle = sky; cx.fillRect(0, 0, W, GROUND);
    cx.fillStyle = sunGlow; cx.fillRect(130, 280, 264, 220);
    cx.fillStyle = '#ffd88a'; circle(262, 414, 32);
    cx.fillStyle = 'rgba(255,236,226,.78)';
    for (const c of clouds) { cx.beginPath(); ell(c.x, c.y, 26 * c.s, 10 * c.s); ell(c.x + 18 * c.s, c.y - 6 * c.s, 18 * c.s, 10 * c.s); ell(c.x - 16 * c.s, c.y - 3 * c.s, 14 * c.s, 8 * c.s); cx.fill(); }
    drawLayer(farImg, farOff);
    drawLayer(midImg, midOff);
    for (const t of towers) { drawTower(t.x, 0, t.gy - GAP / 2, t.seed * 7919, true); drawTower(t.x, t.gy + GAP / 2, GROUND - t.gy - GAP / 2, t.seed * 7919 + 13, false); }
    cx.fillStyle = '#cf9748'; cx.fillRect(0, GROUND, W, H - GROUND);
    dune(GROUND - 3, 6, 0.032, groundOff * 0.6, '#ecc274');
    dune(GROUND + 18, 5, 0.05, groundOff, '#ddaa5e');
    dune(GROUND + 38, 4, 0.07, groundOff * 1.3, '#cf9748');
    drawBird();
    if (stage !== 'ready') {
      cx.font = '800 46px Tajawal, system-ui, sans-serif';
      cx.textAlign = 'center';
      cx.lineWidth = 6;
      cx.strokeStyle = 'rgba(20,16,50,.55)';
      cx.strokeText(String(points), W / 2, 74);
      cx.fillStyle = '#fff';
      cx.fillText(String(points), W / 2, 74);
    }
  }
  return { open, key };
})();

/* ===================== 12. Backup & restore (data is never silently lost) ===================== */
const BK_KEYS = ['tasks', 'bonus', 'nid', 'pin', 'rewards', 'extras', 'xid', 'lvImg', 'cardImg', 'gameLock', 'accts', 'aw', 'claims'];
let bkState = { msg: '', err: false };
let pendingRestore = null;

function b64enc(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64dec(b64) {
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
}
function makeBackup() {
  const s = {};
  for (const k of BK_KEYS) s[k] = S[k];
  return { app: 'weekly-grades', v: 1, ts: Date.now(), s, pref: P };
}
function downloadBackup() {
  const blob = new Blob([JSON.stringify(makeBackup())], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `weekly-grades-backup-${isoOf(new Date())}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast('⬇️ تم تنزيل النسخة الاحتياطية');
}
async function copyBackup() {
  const code = 'WGB1:' + b64enc(JSON.stringify(makeBackup()));
  if (await copyText(code)) toast('📋 تم نسخ رمز النسخة — احفظه في مكان آمن');
  else showTextModal('📋 رمز النسخة الاحتياطية', code, true);
}
/** Accepts a "WGB1:" code or the JSON file text. Throws on anything that is not a clean, complete backup. */
function parseBackup(text) {
  text = String(text || '').trim();
  if (!text || text.length > 9e6) throw new Error('size');
  let obj;
  if (text.startsWith('WGB1:')) obj = JSON.parse(b64dec(text.slice(5).replace(/\s+/g, '')));
  else if (text.startsWith('{')) obj = JSON.parse(text);
  else throw new Error('format');
  if (!isObj(obj) || obj.app !== 'weekly-grades' || obj.v !== 1 || !isObj(obj.s) || !BK_KEYS.every((k) => k in obj.s)) throw new Error('structure');
  const { s, issues } = cleanState(obj.s);
  if (issues) throw new Error('invalid entries');
  if (obj.pref !== undefined && !isObj(obj.pref)) throw new Error('pref');
  return { s, pref: obj.pref === undefined ? null : cleanPrefs(obj.pref), ts: Number.isFinite(obj.ts) ? obj.ts : null };
}

function renderBackup() {
  backupRenderedFor = role;
  const sup = role === 'sup';
  $('#backup').innerHTML = `<h2 class="card-title">💾 نسخة احتياطية</h2>
    <p class="muted sm">البيانات محفوظة على هذا الجهاز فقط. نزّل نسخة بين فترة وفترة، أو انسخ الرمز لنقل كل شيء لجهاز ثاني.</p>
    <div class="btn-row"><button type="button" class="btn" data-act="bkDownload" data-fk="bkDl">⬇️ تنزيل ملف</button><button type="button" class="btn ghost" data-act="bkCopy" data-fk="bkCp">📋 نسخ الرمز</button></div>
    ${sup ? `<details class="sub"><summary>♻️ استعادة نسخة</summary>
      <label class="fld"><span>الصق رمز النسخة (يبدأ بـ WGB1:) أو محتوى الملف</span><textarea id="bkText" rows="3" spellcheck="false" autocomplete="off"></textarea></label>
      <div class="btn-row"><button type="button" class="btn" data-act="bkCheck" data-fk="bkCheck">تحقّق من الرمز</button><button type="button" class="btn ghost" data-act="bkFile" data-fk="bkFile">📂 اختيار ملف</button></div>
      <div id="bkMsg" class="msg" role="alert"></div>
    </details>` : '<p class="muted sm">♻️ الاستعادة من نسخة متاحة للمشرف فقط.</p>'}`;
  drawBkMsg();
}
function drawBkMsg() {
  const el = $('#bkMsg');
  if (!el) return;
  el.className = `msg${bkState.err ? ' err' : ''}`;
  el.innerHTML = bkState.msg
    ? `<p>${esc(bkState.msg)}</p>${pendingRestore ? '<p class="warn-msg">سيتم استبدال كل البيانات الحالية على هذا الجهاز. نصيحة: نزّل نسخة من بياناتك الحالية أولًا.</p><button type="button" class="btn danger" data-act="bkConfirm" data-fk="bkConfirm">استبدال بياناتي بهذه النسخة</button>' : ''}`
    : '';
}
function prepareRestore(text) {
  try {
    pendingRestore = parseBackup(text);
    const r = pendingRestore, weeks = sum(Object.values(r.s.aw).map((w) => Object.keys(w).length));
    bkState = { err: false, msg: `✓ نسخة صالحة${r.ts ? ` من ${dm(new Date(r.ts))}/${new Date(r.ts).getFullYear()}` : ''}: ${r.s.accts.length} حساب، ${r.s.tasks.length} مهام، ${weeks} أسبوع مسجّل.` };
  } catch (_) {
    pendingRestore = null;
    bkState = { err: true, msg: '❌ الرمز أو الملف غير صالح — لم يتغير شيء.' };
  }
  drawBkMsg();
}
function pickBackupFile() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json,application/json,text/plain';
  inp.hidden = true;
  inp.addEventListener('change', async () => {
    const f = inp.files && inp.files[0];
    inp.remove();
    if (!f) return;
    if (f.size > 9e6) { pendingRestore = null; bkState = { err: true, msg: '❌ الملف كبير جدًا — لم يتغير شيء.' }; drawBkMsg(); return; }
    prepareRestore(await f.text());
  });
  document.body.appendChild(inp);
  inp.click();
}
function doRestore() {
  if (role !== 'sup' || !pendingRestore) return;
  const { s, pref } = pendingRestore;
  pendingRestore = null;
  if (storageOK) {
    const ok = lsSet(KEY, JSON.stringify(s));
    if (!ok) { bkState = { err: true, msg: '❌ ما قدرت أحفظ النسخة (المساحة؟) — بياناتك الحالية لم تتغير.' }; drawBkMsg(); return; }
    if (pref) lsSet(PKEY, JSON.stringify(pref));
    location.reload();
    return;
  }
  S = s;
  if (pref) P = pref;
  if (!acctById(P.cur)) P.cur = 'a1';
  bkState = { err: false, msg: '✓ تمت الاستعادة (مؤقتًا — الحفظ غير متاح في هذا المتصفح).' };
  applyPrefs(); renderAll(); renderBackup();
}

/* ===================== 13. Boot ===================== */
function onKey(e) {
  if (!$('#game').hidden) { Game.key(e); return; }
  const m = modals[modals.length - 1];
  if (!m) return;
  if (e.key === 'Escape') { e.preventDefault(); closeModal(m); }
  else if (e.key === 'Tab') trapTab(e, m.box);
}
function bindEvents() {
  const app = $('#app');
  app.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled || !app.contains(b)) return;
    const fn = ACT[b.dataset.act];
    if (fn) fn(b, e);
  });
  app.addEventListener('change', (e) => {
    const el = e.target;
    if (el.classList.contains('lv-input')) saveReward(el);
    else if (el.id === 'bonusIn') saveBonus(el);
    else if (el.id === 'lockIn') setGameLock(el.checked);
  });
  app.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.target.classList.contains('lv-input') || e.target.id === 'bonusIn')) e.target.blur(); });
  $('#toast .toast-undo').addEventListener('click', () => { const u = toastUndo; hideToast(); if (u) u(); });
  document.addEventListener('keydown', onKey);
}
/** Runs every 30 s and when the tab comes back: greeting, midnight and week rollover. */
function tick() {
  const t = midnight();
  renderHero();
  if (+t === +today) return;
  const wasThisWeek = isThisWeek();
  today = t;
  if (wasThisWeek) { viewWk = thisWk(); openDays = new Set([today.getDay()]); }
  renderAll();
}
/** Another tab changed the data: reload it so the two tabs never overwrite each other. */
function onStorage(e) {
  if (e.key !== null && e.key !== KEY && e.key !== PKEY) return;
  load(); applyPrefs(); renderAll(); renderBackup();
}
function boot() {
  load();
  today = midnight();
  viewWk = thisWk();
  openDays = new Set([today.getDay()]);
  applyPrefs();
  bindEvents();
  renderAll();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then((p) => { persisted = !!p; renderStatus(); }).catch(() => {});
  setInterval(tick, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
  onMQ(mqDark, () => { if (P.mode === 'auto') applyTheme(); });
  onMQ(mqReduce, applyMotion);
  window.addEventListener('storage', onStorage);
}
boot();
